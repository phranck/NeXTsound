opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

identifier_name:
  min_length: 3
  excluded:
    - id

trailing_comma:
  mandatory_comma: true

line_length:
  warning: 140
  error: 140
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100
