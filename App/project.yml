name: NeXTsound
options:
  minimumXcodeGenVersion: ${NXS_XCODEGEN_VERSION}
  deploymentTarget:
    macOS: ${NXS_MACOS_MINIMUM}
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
    # Scripts/app-version.sh derives both from the git history, and Scripts/app.sh exports them.
    MARKETING_VERSION: "${NXS_APP_VERSION}"
    CURRENT_PROJECT_VERSION: "${NXS_BUILD_NUMBER}"
    # NXSUSBHostShim links Homebrew's static libusb, which Homebrew only ships for arm64 on Apple Silicon.
    ARCHS: arm64
    VALID_ARCHS: arm64
packages:
  Workbench:
    path: Workbench
targets:
  NeXTsound:
    type: application
    platform: macOS
    sources:
      - Application
      # The sound profile type's icon, which Scripts/profile-icon.sh renders before XcodeGen runs.
      - path: Generated/ProfileIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: NeXTsound
        PRODUCT_BUNDLE_IDENTIFIER: work.layered.NeXTsound
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: Workbench
        product: NeXTsoundWorkbench
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: NeXTsound
        # XcodeGen writes 1.0 and 1 into a generated Info.plist unless these name the build settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 LAYERED.work"
        # The live spectrum taps the audio macOS sends to the SoundBox, which needs the system audio recording permission.
        NSAudioCaptureUsageDescription: "NeXTsound reads the audio your Mac sends to the SoundBox to show its live spectrum. None of it is stored or passed on."
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.music
        # A profile file holds JSON, but the type is plain data: Quick Look renders a text preview of any type that
        # conforms to public.json, which the Finder's icon view would show instead of the profile icon.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ${NXS_PROFILE_IDENTIFIER}
            UTTypeDescription: NeXTsound sound profile
            UTTypeIconFile: ProfileIcon
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ${NXS_PROFILE_EXTENSION}
        # The app owns the profile type, so the Finder opens a profile file in it, and the front panel imports it.
        CFBundleDocumentTypes:
          - CFBundleTypeName: NeXTsound sound profile
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - ${NXS_PROFILE_IDENTIFIER}
schemes:
  NeXTsound:
    build:
      targets:
        NeXTsound: all
    run:
      config: Debug
    archive:
      config: Release
